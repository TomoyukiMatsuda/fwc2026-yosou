name: Deploy to Cloudflare Workers

# main への push（= PR マージ）で自動デプロイ。手動実行も可。
on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイを直列化（進行中のデプロイは中断しない）
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply fifa-wcup2026-db --remote

      - name: Build & Deploy
        run: npm run deploy
